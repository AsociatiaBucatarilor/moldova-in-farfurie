# Alternative to the local cluster (`pnpm db:start`): Postgres in Docker.
# Run `docker compose up -d` and set in .env:
# DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/moldova_in_farfurie
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: moldova_in_farfurie
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
